name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w apps/web

      - name: Typecheck
        run: npm run typecheck -w apps/web

      - name: Build
        run: npm run build -w apps/web
        env:
          TZ: Asia/Jakarta

  worker:
    name: Worker (Python check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q .

      - name: Import check
        run: python -c "import config, orchestrator, tools, providers; print('imports ok')"
        env:
          DATABASE_URL: postgres://orvexa:orvexa@localhost:5432/orvexa
          REDIS_URL: redis://localhost:6379
          TZ: Asia/Jakarta
