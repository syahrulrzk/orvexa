# ============================================================
# ORVEXA — Self-host stack
#   docker compose up --build
# ============================================================
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: orvexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orvexa
      POSTGRES_PASSWORD: orvexa
      POSTGRES_DB: orvexa
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orvexa -d orvexa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: orvexa-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: orvexa-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Jakarta
      DATABASE_URL: postgres://orvexa:orvexa@postgres:5432/orvexa
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "3000:3000"
    # Agar bisa memanggil LLM lokal / mock provider di mesin host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: orvexa-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Jakarta
      DATABASE_URL: postgres://orvexa:orvexa@postgres:5432/orvexa
      REDIS_URL: redis://redis:6379
      # Internal API Next.js (Fase 3) — worker memakai ini untuk persist run.
      ORVEXA_WEB_URL: http://web:3000
    # Agar bisa memanggil LLM lokal (Ollama/llama.cpp) di mesin host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  # ============================================================
  # MCP servers (F6-02) — Prometheus & Grafana
  #   Read-only bridge ke stack monitoring; tools terdaftar lewat seed
  #   (MCP_PROMETHEUS_URL / MCP_GRAFANA_URL) + grant ke agent NOC.
  # ============================================================
  mcp-prometheus:
    build:
      context: ./mcp-servers
      dockerfile: Dockerfile
    container_name: orvexa-mcp-prometheus
    restart: unless-stopped
    profiles: ["mcp"]
    environment:
      TZ: Asia/Jakarta
      MCP_PORT: 9101
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://localhost:9090}
      MCP_BEARER_TOKEN: ${MCP_PROM_BEARER:-}
    ports:
      - "9101:9101"

  mcp-grafana:
    build:
      context: ./mcp-servers
      dockerfile: Dockerfile
    container_name: orvexa-mcp-grafana
    restart: unless-stopped
    profiles: ["mcp"]
    environment:
      TZ: Asia/Jakarta
      MCP_PORT: 9102
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3001}
      GRAFANA_API_KEY: ${GRAFANA_API_KEY:-}
      MCP_BEARER_TOKEN: ${MCP_GRAFANA_BEARER:-}
    ports:
      - "9102:9102"

  # Wazuh API (JWT) — server MCP ini yang login & cache token
  mcp-wazuh:
    build:
      context: ./mcp-servers
      dockerfile: Dockerfile
    container_name: orvexa-mcp-wazuh
    restart: unless-stopped
    profiles: ["mcp"]
    environment:
      TZ: Asia/Jakarta
      MCP_PORT: 9103
      WAZUH_URL: ${WAZUH_URL:-https://localhost:55000}
      WAZUH_USER: ${WAZUH_USER:-wazuh-wui}
      WAZUH_PASS: ${WAZUH_PASS:-wazuh-wui}
      WAZUH_TLS_VERIFY: ${WAZUH_TLS_VERIFY:-false}
      MCP_BEARER_TOKEN: ${MCP_WAZUH_BEARER:-}
    ports:
      - "9103:9103"

  # Docker Engine API via unix socket (read-only)
  mcp-docker:
    build:
      context: ./mcp-servers
      dockerfile: Dockerfile
    container_name: orvexa-mcp-docker
    restart: unless-stopped
    profiles: ["mcp"]
    environment:
      TZ: Asia/Jakarta
      MCP_PORT: 9104
      DOCKER_SOCKET: /var/run/docker.sock
      MCP_BEARER_TOKEN: ${MCP_DOCKER_BEARER:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9104:9104"

  # Kubernetes via kubectl (read-only) — mewarisi kubeconfig host
  mcp-kubernetes:
    build:
      context: ./mcp-servers
      dockerfile: Dockerfile
    container_name: orvexa-mcp-kubernetes
    restart: unless-stopped
    profiles: ["mcp"]
    environment:
      TZ: Asia/Jakarta
      MCP_PORT: 9105
      KUBECONFIG: /app/kube/config
      MCP_BEARER_TOKEN: ${MCP_K8S_BEARER:-}
    volumes:
      - ${KUBECONFIG_PATH:-$HOME/.kube/config}:/app/kube/config:ro
    ports:
      - "9105:9105"

  # UniFi Controller (cookie SESSION + CSRF) — F6-04
  mcp-unifi:
    build:
      context: ./mcp-servers
      dockerfile: Dockerfile
    container_name: orvexa-mcp-unifi
    restart: unless-stopped
    profiles: ["mcp"]
    environment:
      TZ: Asia/Jakarta
      MCP_PORT: 9106
      UNIFI_URL: ${UNIFI_URL:-https://localhost:8443}
      UNIFI_USER: ${UNIFI_USER:-}
      UNIFI_PASS: ${UNIFI_PASS:-}
      UNIFI_TLS_VERIFY: ${UNIFI_TLS_VERIFY:-false}
      MCP_BEARER_TOKEN: ${MCP_UNIFI_BEARER:-}
    ports:
      - "9106:9106"

  # MikroTik RouterOS REST API (Basic auth) — F6-04
  mcp-mikrotik:
    build:
      context: ./mcp-servers
      dockerfile: Dockerfile
    container_name: orvexa-mcp-mikrotik
    restart: unless-stopped
    profiles: ["mcp"]
    environment:
      TZ: Asia/Jakarta
      MCP_PORT: 9107
      MIKROTIK_URL: ${MIKROTIK_URL:-https://localhost:443}
      MIKROTIK_USER: ${MIKROTIK_USER:-admin}
      MIKROTIK_PASS: ${MIKROTIK_PASS:-}
      MIKROTIK_TLS_VERIFY: ${MIKROTIK_TLS_VERIFY:-false}
      MCP_BEARER_TOKEN: ${MCP_MIKROTIK_BEARER:-}
    ports:
      - "9107:9107"

  # FortiGate REST API v2 (token) — F6-04 ("Firewall" di PRD)
  mcp-fortigate:
    build:
      context: ./mcp-servers
      dockerfile: Dockerfile
    container_name: orvexa-mcp-fortigate
    restart: unless-stopped
    profiles: ["mcp"]
    environment:
      TZ: Asia/Jakarta
      MCP_PORT: 9108
      FORTIGATE_URL: ${FORTIGATE_URL:-https://localhost:8443}
      FORTIGATE_TOKEN: ${FORTIGATE_TOKEN:-}
      FORTIGATE_TLS_VERIFY: ${FORTIGATE_TLS_VERIFY:-false}
      MCP_BEARER_TOKEN: ${MCP_FORTIGATE_BEARER:-}
    ports:
      - "9108:9108"

  # ============================================================
  # Reverse proxy + HTTPS otomatis (opsional)
  #   docker compose --profile proxy up -d
  # Butuh domain sudah mengarah ke IP server ini.
  # ============================================================
  caddy:
    image: caddy:2-alpine
    container_name: orvexa-caddy
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      ORVEXA_DOMAIN: ${ORVEXA_DOMAIN:-originlabs.my.id}
      TZ: Asia/Jakarta
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  uploads:
  caddydata:
  caddyconfig:
