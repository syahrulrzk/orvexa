# ============================================================
# ORVEXA — Self-host stack
#   docker compose up --build
# ============================================================
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: orvexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orvexa
      POSTGRES_PASSWORD: orvexa
      POSTGRES_DB: orvexa
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orvexa -d orvexa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: orvexa-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: orvexa-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Jakarta
      DATABASE_URL: postgres://orvexa:orvexa@postgres:5432/orvexa
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "3000:3000"
    # Agar bisa memanggil LLM lokal / mock provider di mesin host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: orvexa-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Jakarta
      DATABASE_URL: postgres://orvexa:orvexa@postgres:5432/orvexa
      REDIS_URL: redis://redis:6379
      # Internal API Next.js (Fase 3) — worker memakai ini untuk persist run.
      ORVEXA_WEB_URL: http://web:3000
    # Agar bisa memanggil LLM lokal (Ollama/llama.cpp) di mesin host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  # ============================================================
  # MCP servers (F6-02) — Prometheus & Grafana
  #   Read-only bridge ke stack monitoring; tools terdaftar lewat seed
  #   (MCP_PROMETHEUS_URL / MCP_GRAFANA_URL) + grant ke agent NOC.
  # ============================================================
  mcp-prometheus:
    build:
      context: ./mcp-servers
      dockerfile: Dockerfile
    container_name: orvexa-mcp-prometheus
    restart: unless-stopped
    profiles: ["mcp"]
    environment:
      TZ: Asia/Jakarta
      MCP_PORT: 9101
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://localhost:9090}
      MCP_BEARER_TOKEN: ${MCP_PROM_BEARER:-}
    ports:
      - "9101:9101"

  mcp-grafana:
    build:
      context: ./mcp-servers
      dockerfile: Dockerfile
    container_name: orvexa-mcp-grafana
    restart: unless-stopped
    profiles: ["mcp"]
    environment:
      TZ: Asia/Jakarta
      MCP_PORT: 9102
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3001}
      GRAFANA_API_KEY: ${GRAFANA_API_KEY:-}
      MCP_BEARER_TOKEN: ${MCP_GRAFANA_BEARER:-}
    ports:
      - "9102:9102"

  # ============================================================
  # Reverse proxy + HTTPS otomatis (opsional)
  #   docker compose --profile proxy up -d
  # Butuh domain sudah mengarah ke IP server ini.
  # ============================================================
  caddy:
    image: caddy:2-alpine
    container_name: orvexa-caddy
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      ORVEXA_DOMAIN: ${ORVEXA_DOMAIN:-originlabs.my.id}
      TZ: Asia/Jakarta
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  uploads:
  caddydata:
  caddyconfig:
